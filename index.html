<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="description" content="Public Forum flowing for rebuttal speakers." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16181f" />
    <title>U Flow</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var s = JSON.parse(localStorage.getItem('rebuttal-flow-ui') || '{}').state || {};
        var m = s.themeMode || s.theme || 'dark';
        var d = m === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : m === 'dark';
        document.documentElement.classList.toggle('dark', d);
        if (s.accent) {
          document.documentElement.style.setProperty('--accent-h', s.accent.h);
          document.documentElement.style.setProperty('--accent-c', s.accent.c);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
