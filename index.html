<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="description" content="Public Forum flowing for rebuttal speakers." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16181f" />
    <title>U Flow</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var s = JSON.parse(localStorage.getItem('rebuttal-flow-ui') || '{}').state || {};
        var m = s.themeMode || s.theme || 'dark';
        var d = m === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : m === 'dark';
        document.documentElement.classList.toggle('dark', d);
        if (s.accent) {
          document.documentElement.style.setProperty('--accent-h', s.accent.h);
          document.documentElement.style.setProperty('--accent-c', s.accent.c);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only if the app hasn't rendered after 8 s, so a failed load is never a silent blank page. -->
    <div id="boot-fail" hidden style="font: 15px/1.5 system-ui, sans-serif; max-width: 30rem; margin: 15vh auto; padding: 0 1.5rem">
      <h1 style="font-size: 1.2rem">U Flow didn’t load</h1>
      <p id="boot-hint" hidden style="padding: 0.6rem 0.8rem; border: 1px solid; border-radius: 6px"></p>
      <p>Try reloading. If that doesn’t help, reset the app files: this clears the cached copy of the app and downloads it again. Your bank, cases and rounds are not touched.</p>
      <p>
        <button onclick="location.reload()">Reload</button>
        <button id="boot-reset">Reset app files</button>
      </p>
      <pre id="boot-err" style="white-space: pre-wrap; font-size: 12px; opacity: 0.7"></pre>
    </div>
    <script>
      (function () {
        var errors = [];
        // Capture phase also catches failed <script>/<link> loads (e.g. a 404 after a path change).
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            errors.push(t && (t.src || t.href) ? 'Could not load ' + (t.src || t.href) : e.message);
          },
          true,
        );
        addEventListener('unhandledrejection', function (e) {
          errors.push(String(e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount) return;
          document.getElementById('boot-err').textContent = errors.join('\n') + '\n' + location.href;
          // The page is the repo's source index.html, not the build: Pages is publishing the branch.
          if (document.querySelector('script[src$="src/main.tsx"]')) {
            var hint = document.getElementById('boot-hint');
            hint.textContent =
              'GitHub Pages is serving the source code instead of the built app. In the repo, open Settings → Pages and set Source to “GitHub Actions”, then run the “Deploy to GitHub Pages” workflow.';
            hint.hidden = false;
          }
          document.getElementById('boot-fail').hidden = false;
        }, 8000);
        document.getElementById('boot-reset').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).finally(function () { location.reload(); });
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
